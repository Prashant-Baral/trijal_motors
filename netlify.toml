[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS — tell browsers to always use HTTPS, including subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # COOP — isolate the top-level window from cross-origin popups
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Permissions Policy — restrict browser features not used by the site
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

# Long cache for Vite-fingerprinted assets (JS/CSS bundles are immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 1-week cache for images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# 1-week cache for fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"